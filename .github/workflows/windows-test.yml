name: Test Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: v1.0.1
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test driver
        run: npm install --no-save playwright@1.62.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Download installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir "$env:RUNNER_TEMP/ally-installer"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir "$env:RUNNER_TEMP/ally-previous"
          if ($LASTEXITCODE -ne 0) { throw "Baseline download failed" }
      - name: Install 1.0.0 and populate real app storage
        shell: pwsh
        run: |
          $previous = Get-ChildItem "$env:RUNNER_TEMP/ally-previous" -Filter *.exe | Select-Object -First 1
          $install = Start-Process $previous.FullName -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(120000) -or $install.ExitCode -ne 0) { throw "Baseline install failed" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          node scripts/windows-upgrade-profile.mjs seed $exe.FullName "$env:RUNNER_TEMP/ally-before.json"
          if ($LASTEXITCODE -ne 0) { throw "Populated profile setup failed" }
      - name: Install candidate and verify every saved record and credential file
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/ally-installer" -Filter *.exe | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(120000) -or $install.ExitCode -ne 0) { throw "Candidate install failed" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          node scripts/windows-upgrade-profile.mjs verify $exe.FullName "$env:RUNNER_TEMP/ally-before.json" $env:RELEASE_TAG.TrimStart('v')
          if ($LASTEXITCODE -ne 0) { throw "Populated profile upgrade failed" }
