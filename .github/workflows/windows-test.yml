name: Test Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: v1.0.7
        type: string
      baseline:
        description: Upgrade paths to run
        required: true
        default: all
        type: choice
        options:
          - all
          - v1.0.6
permissions:
  contents: read
jobs:
  windows:
    name: Upgrade from ${{ matrix.baseline }}
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(inputs.baseline == 'v1.0.6' && '["v1.0.6"]' || '["v1.0.0", "v1.0.1", "v1.0.2", "v1.0.3", "v1.0.4", "v1.0.5", "v1.0.6"]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test driver
        run: npm install --no-save playwright@1.62.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Download installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BASELINE_TAG: ${{ matrix.baseline }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --pattern update.json --dir "$env:RUNNER_TEMP/ally-installer"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir "$env:RUNNER_TEMP/ally-previous"
          if ($LASTEXITCODE -ne 0) { throw "Baseline download failed" }
      - name: Install baseline and populate real app storage
        shell: pwsh
        run: |
          $previous = Get-ChildItem "$env:RUNNER_TEMP/ally-previous" -Filter *.exe | Select-Object -First 1
          $install = Start-Process $previous.FullName -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(120000) -or $install.ExitCode -ne 0) { throw "Baseline install failed" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          node scripts/windows-upgrade-profile.mjs seed $exe.FullName "$env:RUNNER_TEMP/ally-before.json"
          if ($LASTEXITCODE -ne 0) { throw "Populated profile setup failed" }
      - name: Exercise real updater download, installer and automatic reopen
        if: matrix.baseline == 'v1.0.5' || matrix.baseline == 'v1.0.6'
        shell: pwsh
        env:
          BASELINE_TAG: ${{ matrix.baseline }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/ally-installer" -Filter *.exe | Select-Object -First 1
          $seven = "$env:ProgramFiles/7-Zip/7z.exe"
          $unpack = "$env:RUNNER_TEMP/candidate-extract"
          & $seven x $installer.FullName "-o$unpack" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $archive = Get-ChildItem $unpack -Filter 'app-64.7z' -Recurse | Select-Object -First 1
          if (-not $archive) { throw "Candidate payload archive missing" }
          & $seven x $archive.FullName "-o$env:RUNNER_TEMP/candidate-app" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "Candidate payload extraction failed" }
          $asar = Get-ChildItem "$env:RUNNER_TEMP/candidate-app" -Filter app.asar -Recurse | Select-Object -First 1
          if (-not $asar) { throw "Candidate app archive missing" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          node scripts/windows-updater-hop.mjs $exe.FullName "$env:RUNNER_TEMP/ally-before.json" $env:RELEASE_TAG.TrimStart('v') $asar.FullName "$env:RUNNER_TEMP/ally-installer/update.json" $env:BASELINE_TAG.TrimStart('v')
          if ($LASTEXITCODE -ne 0) { throw "Real updater-driven upgrade failed" }
      - name: Install candidate and verify every saved record and credential file
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $phase = 'verify'
          if ('${{ matrix.baseline }}' -in @('v1.0.5','v1.0.6')) { $phase = 'verify-after-hop' } else {
            $installer = Get-ChildItem "$env:RUNNER_TEMP/ally-installer" -Filter *.exe | Select-Object -First 1
            $install = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
            if (-not $install.WaitForExit(120000) -or $install.ExitCode -ne 0) { throw "Candidate install failed" }
          }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          node scripts/windows-upgrade-profile.mjs $phase $exe.FullName "$env:RUNNER_TEMP/ally-before.json" $env:RELEASE_TAG.TrimStart('v')
          if ($LASTEXITCODE -ne 0) { throw "Populated profile upgrade failed" }
      - name: Verify automatic cold-start installation and failure recovery
        if: matrix.baseline == 'v1.0.6'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ally Finance.exe' -Recurse | Select-Object -First 1
          $asar = Get-ChildItem "$env:RUNNER_TEMP/candidate-app" -Filter app.asar -Recurse | Select-Object -First 1
          $installer = Get-ChildItem "$env:RUNNER_TEMP/ally-installer" -Filter *.exe | Select-Object -First 1
          node scripts/windows-cold-start.mjs $exe.FullName "$env:RUNNER_TEMP/ally-before.json" $env:RELEASE_TAG.TrimStart('v') $asar.FullName "$env:RUNNER_TEMP/ally-installer/update.json" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Cold-start update verification failed" }
      - name: Report synthetic startup diagnostics
        if: always() && matrix.baseline == 'v1.0.6'
        shell: pwsh
        run: |
          $trace = "$env:RUNNER_TEMP/ally-cold-start/events.json"
          if (Test-Path $trace) { Get-Content $trace }
